[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-label-anchor"
version = "1.0.0"
description = "SOLAR: fixed orthogonal label anchors for single-cell reference mapping"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10",
  "h5py>=3.10",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.2",
]

[project.optional-dependencies]
# Needed only to verify the manuscript numbers and rebuild figures from data/.
verify = ["pandas>=2", "pyyaml>=6", "scikit-learn>=1.3", "matplotlib>=3.7", "pytest>=8"]

[project.scripts]
solar-benchmark = "SOLAR.benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
