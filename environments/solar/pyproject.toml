[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-label-anchor"
version = "0.1.0"
description = "Portable label-anchor SOLAR variants for external benchmarks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anndata>=0.12.10",
  "h5py>=3.15.1",
  "numpy>=2.2",
  "scipy>=1.15",
  "scikit-learn>=1.6",
  "torch>=2.7,<2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
solar-benchmark = "SOLAR.benchmark.cli:main"

[tool.setuptools]
packages = ["SOLAR", "SOLAR.src", "SOLAR.benchmark"]

[tool.setuptools.package-dir]
SOLAR = "."
"SOLAR.src" = "src"
"SOLAR.benchmark" = "benchmark"
