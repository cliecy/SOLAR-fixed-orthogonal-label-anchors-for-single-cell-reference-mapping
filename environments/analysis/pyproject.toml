[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scib-dataset-inspection"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Guanjie Zou" }]
dependencies = [
  "anndata>=0.10,<0.13",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
experiment = [
  "anndata2ri>=1.3,<2",
  "bbknn>=1.6,<2",
  "harmonypy>=0.0.10,<1",
  "igraph>=0.11,<2",
  "jax[cuda12]>=0.5,<0.8; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "leidenalg>=0.10,<1",
  "numba>=0.61,<0.63",
  "scanorama>=1.7,<2",
  "scanpy>=1.11,<2",
  "scib>=1.1,<2",
  "scib-metrics==0.5.6; python_version < '3.11'",
  "scib-metrics==0.5.10; python_version >= '3.11'",
  "rpy2>=3.5.17,<3.6",
  "scikit-learn>=1.6,<2",
  "scikit-misc>=0.5,<1",
  "scvi-tools>=1.3,<2",
  # Keep CUDA 12-era wheels compatible with both Volta V100 and Ampere A100.
  "torch>=2.6,<2.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
