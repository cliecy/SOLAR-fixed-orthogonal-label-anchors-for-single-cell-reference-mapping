[workspace]
name = "scib-paper-metrics"
version = "0.1.0"
description = "Legacy environment for the scIB paper metric implementation"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.7.*"
numpy = "==1.18.1"
pandas = "0.25.*"
scipy = "1.4.*"
scikit-learn = "0.22.*"
scanpy = "==1.4.6"
anndata = "==0.7.1"
h5py = "2.10.*"
get_version = "==2.1"
numba = "0.46.*"
llvmlite = "0.30.*"
umap-learn = "==0.3.10"
louvain = "==0.6.1"
python-igraph = "==0.7.1.post7"
igraph = "==0.7.1"
networkx = "2.3.*"
matplotlib-base = "3.1.*"
seaborn = "0.10.*"
memory_profiler = "0.57.*"
r-base = "3.6.*"
rpy2 = "==3.1.0"
anndata2ri = "==1.0.2"
r-fnn = "*"
r-cluster = "*"
r-ggplot2 = "*"
r-mass = "*"
r-matrix = "*"
r-rcolorbrewer = "*"
r-reshape2 = "*"
pip = "*"
setuptools-scm = "*"

[tasks]
install-scib = "bash ../../scripts/install_paper_scib.sh"
install-kbet = "bash ../../scripts/install_scib_kbet.sh"
versions = "python ../../scripts/check_paper_scib_environment.py"
